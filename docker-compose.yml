version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: solar-forecasting-api:latest
    container_name: solar_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=${MODEL_PATH:-models/advanced_model.pkl}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env.example          # override by creating a real .env file
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
